        <script>
            const isPrime = (numInput) => {
                if (numInput < 2) {
                    return false;
                } else {
                    for (let i = 2; i < numInput; i++) {
                        if (numInput % i == 0) {
                            return false;
                        }
                    }
                    return true;
                }
            }
            //create array with below and display numbers are prime
            let arrNum1 = [2, 3, 5, 8, 12, 11, 10, 7, 1];
            let arrNum2 = [13, 15, 20, 34, 6, 1, 0];
            let arrNum = [...arrNum1, ...arrNum2];

            for (let i = 0; i < arrNum.length; i++) {
                if (isPrime(arrNum[i])) {
                    alert(arrNum[i] + " is Prime number")
                }
            }

            //use Destructuring assignment
            const person={
                firstName: "fu",
                lastName: "ĐH FPT",
                age: 10
            };
            const{firstName, lastName}= person;
            alert(firstName);

            const number = [1,2,3,4,5];
            const [num1, num2, ...num3]= number;
            alert(num1+"and"+num2+"and"+num3);
