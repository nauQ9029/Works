        <script>
            //create function to check Prime number by arrow function
            
            const isPrime = (numInput) => {
                if (numInput < 2) {
                    return false;
                } else {
                    for (let i = 2; i < numInput; i++) {
                        if (numInput % i == 0) {
                            return false;
                        }
                    }
                    return true;
                }
            }
            //create array with below and display numbers are prime
            let arrNum = [2, 3, 5, 8, 12, 11, 10, 7, 1];
            for (let i = 0; i < arrNum.length; i++) {
                if (isPrime(arrNum[i])) {
                    alert(arrNum[i] + "is Prime number")
                }
            }



        </script>
