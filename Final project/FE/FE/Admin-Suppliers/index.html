<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- CSS for header and sidebar-->
    <link rel="stylesheet" href="headerNSidebar.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scale-container">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-2 bg-light">
            <!-- Sidebar -->
            <div id="sidebar"></div>
          </div>
          <div class="col-md-10 bg-light">
            <!-- Header -->
            <div id="header"></div>
            <!-- Main Content -->
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-body">
                    <div
                      class="d-flex justify-content-between align-items-center mb-4"
                    >
                      <h3 class="card-title mb-4">Top Selling Stock</h3>
                      <div
                        class="d-grid gap-2 d-md-flex justify-content-md-end"
                      >
                        <button class="btn btn-success mb-4">
                          New Supplier
                        </button>
                        <button class="btn btn-outline-secondary mb-4">
                          Filters
                        </button>
                        <button class="btn btn-outline-secondary mb-4">
                          Download All
                        </button>
                      </div>
                    </div>
                    <!-- Supplier Data Table -->
                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th scope="col">Supplier Name</th>
                            <th scope="col">Contact Number</th>
                            <th scope="col">Email</th>
                            <th scope="col">Address</th>
                            <th scope="col">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <!-- Static Supplier Data -->

                          <!--  -->
                        </tbody>
                      </table>
                    </div>
                    <!-- Pagination Section -->
                    <div
                      class="d-flex justify-content-between align-items-center mt-3"
                    >
                      <button class="btn btn-outline-secondary" id="prevBtn">
                        Previous
                      </button>
                      <span id="pageInfo">Page 1 of 10</span>
                      <button class="btn btn-outline-secondary" id="nextBtn">Next</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
