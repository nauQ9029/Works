<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- CSS for header and sidebar-->
    <link rel="stylesheet" href="headerNSidebar.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scale-container">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-2 bg-light">
            <!-- Sidebar -->
            <div id="sidebar"></div>
          </div>
          <div class="col-md-10 bg-light">
            <!-- Header -->
            <div id="header"></div>
            <!-- Main Content -->
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-body">
                    <div
                      class="d-flex justify-content-between align-items-center mb-4"
                    >
                      <h3 class="card-title mb-4">Danh sách nhập đơn hàng</h3>
                      <div
                        class="d-grid gap-2 d-md-flex justify-content-md-end"
                      >
                        <button class="btn btn-success mb-4">
                          Thêm đơn nhập hàng
                        </button>

                        <button class="btn btn-outline-secondary mb-4">
                          Bộ lọc
                        </button>
                        <button class="btn btn-outline-secondary mb-4">
                          Tải xuống tất cả
                        </button>
                      </div>
                    </div>
                    <!-- Supplier Data Table -->
                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th scope="col">Lô ID</th>
                            <th scope="col">Nhà cung cấp</th>
                            <th scope="col">Ngày nhập</th>
                            <th scope="col">Tổng tiền</th>
                            <th scope="col">Số lượng sản phẩm</th>
                            <th scope="col">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <!-- Supplier Data -->

                          <!--  -->
                        </tbody>
                      </table>
                    </div>
                    <!-- Pagination Section -->
                    <div
                      class="d-flex justify-content-between align-items-center mt-3"
                    >
                      <button class="btn btn-outline-secondary" id="prevBtn">
                        Previous
                      </button>
                      <span id="pageInfo">Page 1 of 10</span>
                      <button class="btn btn-outline-secondary" id="nextBtn">
                        Next
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Modals -->
            <!-- Create input modal -->
            <!-- Create new suppliers -->
            <div
              class="modal fade"
              id="newSupplierModal"
              tabindex="-1"
              aria-labelledby="newSupplierModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="newSupplierModalLabel">
                      Thêm đơn nhập hàng
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form id="newSupplierForm">
                      <div class="row mb-3">
                        <label
                          for="supplierName"
                          class="col-sm-4 col-form-label"
                          >Tên nhà cung cấp</label
                        >
                        <div class="col-sm-8">
                          <input
                            type="text"
                            class="form-control"
                            id="supplierName"
                            placeholder="Tên nhà cung cấp"
                            required
                          />
                        </div>
                      </div>
                      <div class="row mb-3">
                        <label
                          for="supplierAddress"
                          class="col-sm-4 col-form-label"
                          >Ngày nhập</label
                        >
                        <div class="col-sm-8">
                          <input
                            type="text"
                            class="form-control"
                            id="supplierAddress"
                            placeholder="Ngày nhập"
                            required
                          />
                        </div>
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      data-bs-dismiss="modal"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      class="btn btn-success"
                      form="newSupplierForm"
                    >
                      Xác nhận
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Edit input modal -->
            <div
              class="modal fade"
              id="editModal"
              tabindex="-1"
              aria-labelledby="editModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">
                      Chỉnh sửa đơn nhập
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label for="userName" class="form-label"
                          >Tên nhà phân phối</label
                        >
                        <input type="text" class="form-control" id="userName" />
                      </div>
                      <div class="mb-3">
                        <label for="userInDate" class="form-label"
                          >Ngày nhập</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="userInDate"
                        />
                      </div>
                      <div class="mb-3">
                        <label for="userCost" class="form-label"
                          >Tổng tiền</label
                        >
                        <input type="text" class="form-control" id="userCost" />
                      </div>
                      <div class="mb-3">
                        <label for="userQuantity" class="form-label"
                          >Số lượng sản phẩm</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="userQuantity"
                        />
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      data-bs-dismiss="modal"
                    >
                      Đóng
                    </button>
                    <button type="button" class="btn btn-success">
                      Lưu thay đổi
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</html>
