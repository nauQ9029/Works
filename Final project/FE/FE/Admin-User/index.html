<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- CSS for header and sidebar-->
    <link rel="stylesheet" href="headerNSidebar.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scale-container">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-2 bg-light">
            <!-- Sidebar -->
            <div id="sidebar"></div>
          </div>
          <div class="col-md-10 bg-light">
            <!-- Header -->
            <div id="header"></div>
            <!-- Main Content -->
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="card-body">
                    <div
                      class="d-flex justify-content-between align-items-center mb-4"
                    >
                      <h3 class="card-title mb-4">Người dùng</h3>
                      <div
                        class="d-grid gap-2 d-md-flex justify-content-md-end"
                      >
                        <button class="btn btn-outline-secondary mb-4">
                          Bộ lọc
                        </button>
                        <button class="btn btn-outline-secondary mb-4">
                          Tải xuống tất cả
                        </button>
                      </div>
                    </div>
                    <!-- Supplier Data Table -->
                    <div class="table-responsive">
                      <table class="table table-hover">
                        <thead>
                          <tr>
                            <th scope="col">Người dùng ID</th>
                            <th scope="col">Tên người dùng</th>
                            <th scope="col">Số điện thoại</th>
                            <th scope="col">Email</th>
                            <th scope="col">Vai trò</th>
                            <th scope="col">Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <!-- Supplier Data -->

                          <!--  -->
                        </tbody>
                      </table>
                    </div>
                    <!-- Pagination Section -->
                    <div
                      class="d-flex justify-content-between align-items-center mt-3"
                    >
                      <button class="btn btn-outline-secondary" id="prevBtn">
                        Previous
                      </button>
                      <span id="pageInfo">Page 1 of 10</span>
                      <button class="btn btn-outline-secondary" id="nextBtn">
                        Next
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Edit user modal -->
            <div
              class="modal fade"
              id="editModal"
              tabindex="-1"
              aria-labelledby="editModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">
                      Chỉnh sửa người dùng
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label for="userName" class="form-label"
                          >Tên người dùng</label
                        >
                        <input type="text" class="form-control" id="userName" />
                      </div>
                      <div class="mb-3">
                        <label for="userContact" class="form-label"
                          >Số điện thoại</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="userContact"
                        />
                      </div>
                      <div class="mb-3">
                        <label for="userEmail" class="form-label">Email</label>
                        <input
                          type="email"
                          class="form-control"
                          id="userEmail"
                        />
                      </div>
                      <div class="mb-3">
                        <label for="userRole" class="form-label">Vai trò</label>
                        <select class="form-select" id="userRole">
                          <option value="Manager">Manager</option>
                          <option value="Staff">Staff</option>
                          <option value="Shipper">Shipper</option>
                          <option value="Block">Block</option>
                        </select>
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      data-bs-dismiss="modal"
                    >
                      Đóng
                    </button>
                    <button type="button" class="btn btn-success">
                      Lưu thay đổi
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</html>
