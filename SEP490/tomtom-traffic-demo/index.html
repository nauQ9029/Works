<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomTom Real-Time Traffic</title>
    <!-- TomTom Maps SDK CSS -->
    <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">
    <!-- TomTom Maps SDK JS -->
    <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }
        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>TomTom Traffic Demo</h3>
        <p style="font-size: 14px; color: #555;">Real-Time Traffic in HCMC.</p>
        <label>
            <input type="checkbox" id="toggle-flow" checked>
            Show Traffic Flow (Speed)
        </label>
        <br><br>
        <label>
            <input type="checkbox" id="toggle-incidents" checked>
            Show Traffic Incidents (Jams, Accidents)
        </label>
    </div>

    <div id="map"></div>

    <script>
        // 1. REPLACE THIS WITH YOUR TOMTOM API KEY
        const TOMTOM_API_KEY = 'hN7YaEDK5BFEnvu0pGjsBBN12DwGotq0';

        // Initialize Map
        const map = tt.map({
            key: TOMTOM_API_KEY,
            container: 'map',
            center: [106.6297, 10.8231], // Center focused on Ho Chi Minh City
            zoom: 12, // Starting zoom level
            stylesVisibility: {
                trafficFlow: true,      // Turn on Traffic Flow layer on load
                trafficIncidents: true  // Turn on Traffic Incidents layer on load
            }
        });

        // Add standard navigation controls
        map.addControl(new tt.NavigationControl(), 'top-right');

        // Traffic Settings Controls
        document.getElementById('toggle-flow').addEventListener('change', function(e) {
            if (e.target.checked) map.showTrafficFlow();
            else map.hideTrafficFlow();
        });

        document.getElementById('toggle-incidents').addEventListener('change', function(e) {
            if (e.target.checked) map.showTrafficIncidents();
            else map.hideTrafficIncidents();
        });
    </script>
</body>
</html>
